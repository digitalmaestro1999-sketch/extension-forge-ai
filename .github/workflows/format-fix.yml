name: format-fix

# Auto-fixes Prettier + ESLint issues on pull requests by committing the
# result straight back to the PR branch. Only runs for PRs opened from the
# same repository (forks don't get write tokens and would fail silently).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier (write)
        run: bunx prettier --write .

      - name: ESLint (fix)
        run: bun run lint -- --fix || true

      - name: Commit fixes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing to format. All clean."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply prettier + eslint --fix [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
